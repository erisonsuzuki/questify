default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>

development:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") %>
  queue:
    <<: *default
    url: <%= ENV.fetch("QUEUE_DATABASE_URL") %>
    migrations_paths: db/queue_migrate

test:
  primary:
    <<: *default
    url: <%= ENV.fetch("TEST_DATABASE_URL") %>
  queue:
    <<: *default
    url: <%= ENV.fetch("TEST_QUEUE_DATABASE_URL") %>
    migrations_paths: db/queue_migrate

production:
  primary:
    <<: *default
    url: <%= ENV.fetch("DATABASE_URL") %>
  queue:
    <<: *default
    url: <%= ENV.fetch("QUEUE_DATABASE_URL") %>
    migrations_paths: db/queue_migrate
